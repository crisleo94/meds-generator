<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Herramientas de Farmacia • Suite A4{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f17',
                        darkcard: '#131b2a',
                        darkcard2: '#1c273c',
                        darkborder: '#23324d',
                        brand: {
                            DEFAULT: '#38bdf8',
                            hover: '#0ea5e9',
                            dark: '#0369a1',
                            glow: 'rgba(56, 189, 248, 0.15)'
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-flex;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-200 min-h-screen flex flex-col font-sans selection:bg-brand selection:text-slate-900"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Header con título Herramientas -->
    <header class="border-b border-darkborder bg-darkcard/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-dark to-brand flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-brand/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
                        Herramientas <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand/10 text-brand border border-brand/20">Suite Farmacia</span>
                    </h1>
                    <p class="text-xs text-slate-400">Impresión de tarjetas, ordenamiento de listas y normalizador de catálogos</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center space-x-2 text-xs font-mono text-slate-400 bg-darkcard2 px-3 py-1.5 rounded-lg border border-darkborder">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>En línea • Modo Oscuro</span>
            </div>
        </div>

        <!-- Barra de Navegación por Pestañas (Tabs) -->
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <nav class="flex space-x-2 border-t border-darkborder/50 pt-2 pb-0 text-sm font-medium overflow-x-auto">
                <button type="button"
                        onclick="switchTab('cards')"
                        id="tab-btn-cards"
                        class="tab-btn px-4 py-2.5 rounded-t-lg border-b-2 font-semibold transition-all flex items-center gap-2 text-brand border-brand bg-darkcard2/40">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                    <span>Impresión de Tarjetas</span>
                </button>
                <button type="button"
                        onclick="switchTab('sorter')"
                        id="tab-btn-sorter"
                        class="tab-btn px-4 py-2.5 rounded-t-lg border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
                    <span>Ordenador de Listas</span>
                </button>
                <button type="button"
                        onclick="switchTab('normalizer')"
                        id="tab-btn-normalizer"
                        class="tab-btn px-4 py-2.5 rounded-t-lg border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span>Normalizador de Excel</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-darkborder bg-darkcard/40 py-6 text-center text-xs text-slate-500">
        <p>Herramientas de Farmacia • Impresión A4 • Limpieza y Ordenamiento • Consolidación Excel</p>
    </footer>

    <script>
        function switchTab(tabName) {
            // Ocultar todos los paneles de pestañas
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
            // Quitar estilos activos de todos los botones
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-brand', 'border-brand', 'bg-darkcard2/40');
                btn.classList.add('border-transparent', 'text-slate-400');
            });
            // Mostrar el panel seleccionado
            const activePanel = document.getElementById('panel-' + tabName);
            if (activePanel) {
                activePanel.classList.remove('hidden');
            }
            // Activar el botón correspondiente
            const activeBtn = document.getElementById('tab-btn-' + tabName);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-slate-400');
                activeBtn.classList.add('text-brand', 'border-brand', 'bg-darkcard2/40');
            }
        }
    </script>
</body>
</html>
