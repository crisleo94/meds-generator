<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Generador de Tarjetas de Medicamentos A4{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f17',
                        darkcard: '#131b2a',
                        darkcard2: '#1c273c',
                        darkborder: '#23324d',
                        brand: {
                            DEFAULT: '#38bdf8',
                            hover: '#0ea5e9',
                            dark: '#0369a1',
                            glow: 'rgba(56, 189, 248, 0.15)'
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-flex;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-200 min-h-screen flex flex-col font-sans selection:bg-brand selection:text-slate-900"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Top Navigation / Header -->
    <header class="border-b border-darkborder bg-darkcard/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-dark to-brand flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-brand/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10M7 11h10M7 15h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                        Impresión de Tarjetas <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand/10 text-brand border border-brand/20">3.5 × 1.5 cm</span>
                    </h1>
                    <p class="text-xs text-slate-400">Generador de cenefas y etiquetas A4 para farmacia</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center space-x-2 text-xs font-mono text-slate-400 bg-darkcard2 px-3 py-1.5 rounded-lg border border-darkborder">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>A4 • 90 tarjetas/hoja</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-darkborder bg-darkcard/40 py-6 text-center text-xs text-slate-500">
        <p>Sistema de Generación de Etiquetas para Anaquel y Cenefas de Farmacia • Formato A4</p>
    </footer>
</body>
</html>
