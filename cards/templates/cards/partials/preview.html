<div class="bg-darkcard border border-darkborder rounded-2xl p-6 sm:p-8 shadow-xl space-y-6">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-darkborder gap-4">
        <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-brand">Resultado visual</span>
            <h3 class="text-xl font-bold text-white flex items-center gap-2 mt-0.5">
                <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                Vista previa de impresión (Escala real A4)
            </h3>
        </div>

        <div class="flex flex-wrap gap-2 text-xs">
            <span class="px-2.5 py-1 rounded-md bg-darkcard2 border border-darkborder text-slate-300">
                Título: <strong class="text-brand">{{ title_col }}</strong>
            </span>
            <span class="px-2.5 py-1 rounded-md bg-darkcard2 border border-darkborder text-slate-300">
                Código: <strong class="text-brand">{{ code_col }}</strong>
            </span>
            <span class="px-2.5 py-1 rounded-md {% if with_barcode %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}bg-amber-500/10 text-amber-400 border border-amber-500/20{% endif %}">
                {% if with_barcode %}Con Código de Barras (Code 128){% else %}Solo Números en Negrita{% endif %}
            </span>
        </div>
    </div>

    <!-- Preview Canvas Area -->
    <div class="bg-darkbg/80 border border-darkborder rounded-xl p-4 sm:p-6 flex flex-col items-center justify-center">
        <p class="text-xs text-slate-400 mb-4 text-center">
            Muestra de tarjetas en hoja A4 (cada una de 3.5 cm × 1.5 cm con líneas de corte gris claro):
        </p>

        <div class="max-w-3xl w-full bg-white rounded-lg p-2 sm:p-4 shadow-2xl shadow-black/80 border border-slate-700 overflow-hidden">
            <img src="data:image/png;base64,{{ img_base64 }}"
                 alt="Vista previa de tarjetas A4"
                 class="w-full h-auto object-contain rounded" />
        </div>
    </div>

</div>
